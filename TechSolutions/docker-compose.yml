# TechSolutions S.A.S. - Sistema de Gestión de Activos TI y Mesa de Ayuda
# Entorno de laboratorio académico (CUN). Simula la arquitectura que en la nube
# sería: app -> EC2/ALB, db -> Amazon RDS PostgreSQL, respaldos -> S3.
name: techsolutions

services:
  db:
    image: postgres:16-alpine
    container_name: ts_db
    environment:
      POSTGRES_DB: techsolutions
      POSTGRES_USER: dba_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin_Lab_2026}
    # Configuración inicial del SGBD: monitoreo de consultas y registro de accesos
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=ddl
      -c log_min_duration_statement=200
      -c log_line_prefix='%m [%p] %u@%d '
      -c timezone=America/Bogota
      -c log_timezone=America/Bogota
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dba_admin -d techsolutions"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    container_name: ts_app
    environment:
      # La app se conecta con un usuario de mínimo privilegio, nunca como DBA
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:-App_Lab_2026}@db:5432/techsolutions?application_name=ts_web
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ts_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techsolutions.com.co
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin_Lab_2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
